# Required check for every pull request into main: the kit must build and pass its tests on
# macOS and build for iOS (it is shared by Lily-macos and Lily-ios).
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test (macOS)
        run: swift test

      - name: Build (iOS Simulator)
        run: xcodebuild -scheme LilyKit -destination 'generic/platform=iOS Simulator' build
